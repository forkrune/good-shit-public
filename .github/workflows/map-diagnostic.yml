name: Map runtime diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe MapLibre CDN import
        shell: bash
        run: |
          set -euo pipefail
          MODULE='https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs'
          curl --fail --location --max-time 15 --silent --show-error "$MODULE" -o /tmp/maplibre.mjs
          echo "MapLibre module bytes: $(wc -c < /tmp/maplibre.mjs)"
          cat > /tmp/import-test.html <<'HTML'
          <!doctype html><meta charset="utf-8"><div id="status">starting</div>
          <script type="module">
            const status = document.querySelector('#status');
            status.textContent = 'module script started';
            try {
              const module = await import('https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs');
              status.textContent = `imported:${typeof module.Map}`;
            } catch (error) {
              status.textContent = `error:${error?.message ?? error}`;
              console.error(error);
            }
          </script>
          HTML
          (cd /tmp && python3 -m http.server 8765 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid)
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8765/import-test.html > /tmp/import-dom.html 2>/tmp/import-chrome.log || true
          kill "$(cat /tmp/http.pid)" || true
          echo '--- isolated import result ---'
          grep -oE '<div id="status">[^<]*' /tmp/import-dom.html || true
          grep -Ei 'error|failed|cors|module' /tmp/import-chrome.log | tail -80 || true

      - name: Exercise deployed map in Chrome
        shell: bash
        run: |
          set -euo pipefail
          URL='https://forkrune.github.io/good-shit-public/map/'
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-unsafe-swiftshader \
            --window-size=1440,900 \
            --virtual-time-budget=15000 \
            --enable-logging=stderr \
            --screenshot=/tmp/map.png \
            --dump-dom \
            "$URL" > /tmp/map-dom.html 2> /tmp/chrome.log || true

          echo '--- map status ---'
          grep -oE '<div id="map-status"[^>]*>[^<]*' /tmp/map-dom.html | tail -1 || true
          echo '--- result count ---'
          grep -oE '<strong id="map-result-count"[^>]*>[^<]*' /tmp/map-dom.html | tail -1 || true
          echo '--- fallback ---'
          grep -oE '<div id="map-fallback"[^>]*>|data-map-error[^>]*>[^<]*' /tmp/map-dom.html | tail -4 || true
          echo '--- browser errors/warnings ---'
          grep -Ei 'error|failed|cors|webgl|maplibre|worker|style|tile' /tmp/chrome.log | tail -160 || true

      - name: Upload diagnostic snapshot
        uses: actions/upload-artifact@v4
        with:
          name: map-runtime-diagnostic
          path: |
            /tmp/map.png
            /tmp/map-dom.html
            /tmp/chrome.log
            /tmp/import-dom.html
            /tmp/import-chrome.log
          retention-days: 1
