name: Map layout smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map-layout-smoke.yml'

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: |
          mkdir -p /tmp/map-smoke && cd /tmp/map-smoke
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium firefox >/dev/null
      - name: Verify live map layout in Chromium and Firefox
        shell: bash
        run: |
          cd /tmp/map-smoke
          cat > smoke.mjs <<'JS'
          import { chromium, firefox } from 'playwright';
          const url = 'https://forkrune.github.io/good-shit-public/map/';
          for (const [name, launcher] of [['chromium', chromium], ['firefox', firefox]]) {
            const browser = await launcher.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1600, height: 900 } });
            await page.goto(url, { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
            const state = await page.evaluate(() => {
              const rect = (selector) => {
                const element = document.querySelector(selector);
                const box = element?.getBoundingClientRect();
                return box ? { width: box.width, height: box.height, top: box.top, bottom: box.bottom } : null;
              };
              return {
                map: rect('#map'),
                wrap: rect('.map-canvas-wrap'),
                shell: rect('.map-shell'),
                mapComputedHeight: getComputedStyle(document.querySelector('#map')).height,
                mapLibreCss: [...document.styleSheets].map((sheet) => sheet.href).filter(Boolean).find((href) => href.includes('maplibre-gl')) ?? null,
                status: document.querySelector('#map-status')?.textContent ?? null
              };
            });
            console.log(name, JSON.stringify(state));
            if (!state.map || !state.wrap || state.map.height < 300 || state.wrap.height < 300) {
              throw new Error(`${name}: map layout is still collapsed: ${JSON.stringify(state)}`);
            }
            await browser.close();
          }
          JS
          node smoke.mjs
